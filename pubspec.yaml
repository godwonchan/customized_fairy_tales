name: fairytale_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.0
  flutter_tts: ^4.0.2
  http_parser: ^4.0.2
  tutorial_coach_mark: ^1.2.11
  shared_preferences: ^2.2.2
  lottie: ^3.1.2
  audioplayers: ^6.8.1
  speech_to_text: ^7.0.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cover.png
    - assets/background.png
    - assets/girl_wolf.png
    - assets/book01.png
    - assets/posion01.png
    - assets/star01.png
    - assets/book_001_Snow_White/
    - assets/book_002_The_Little_Mermaid/
    - assets/book_003_Cinderella/
    - assets/animations/
    - assets/images/
    - assets/images/dragon/
    - assets/book_004_Simcheong/